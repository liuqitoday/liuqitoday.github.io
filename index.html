  <style>
    :root {
      --lacquer: #140e0b;
      --paper: #f6efe2;
      --stain: #e7d7bc;
      --ink: #2c241c;
      --mute: #6d6256;
      --cinnabar: #c43c2c;
      --moss: #3d5c4a;
      --line: #d7c6aa;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 50% -10%, #2a1c16 0%, var(--lacquer) 55%),
        var(--lacquer);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 32px 16px 24px;
    }
    .card {
      position: relative;
      width: min(420px, 100%);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.28), transparent 28%),
        var(--paper);
      color: var(--ink);
      padding: 48px 36px 28px;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.35) inset,
        0 24px 60px rgba(0,0,0,0.45);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid var(--line);
      pointer-events: none;
    }
    .seal {
      position: absolute;
      top: 22px;
      right: 26px;
      width: 52px;
      height: 52px;
      border: 2px solid var(--cinnabar);
      color: var(--cinnabar);
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 28px;
      display: grid;
      place-items: center;
      transform: rotate(9deg);
      letter-spacing: 0;
      line-height: 1;
      box-shadow: 0 0 0 1px rgba(196, 60, 44, 0.15);
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--mute);
    }
    h1 {
      font-family: "ZCOOL XiaoWei", "Noto Sans SC", serif;
      font-size: clamp(2.4rem, 8vw, 3rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      margin: 14px 0 6px;
    }
    .who {
      margin: 0 0 28px;
      color: var(--mute);
      font-size: 15px;
    }
    .links {
      display: grid;
      gap: 10px;
      margin: 0 0 28px;
    }
    .links a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1px solid var(--ink);
      color: var(--ink);
      text-decoration: none;
      background: transparent;
      font-size: 15px;
    }
    .links a span {
      color: var(--mute);
      font-size: 12px;
      letter-spacing: 0.04em;
    }
    .links a:hover {
      background: var(--ink);
      color: var(--paper);
    }
    .links a:hover span { color: var(--stain); }
    .links a:focus-visible {
      outline: 2px solid var(--cinnabar);
      outline-offset: 3px;
    }
    .note {
      margin: 0;
      color: var(--mute);
      font-size: 13px;
      line-height: 1.6;
    }
    .note a { color: var(--moss); }
    footer {
      width: min(420px, 100%);
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #8a7b6c;
      font-size: 12px;
    }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--stain); }
    @media (prefers-reduced-motion: no-preference) {
      .card { animation: rise 0.6s ease both; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }
    }
  </style>
</head>
